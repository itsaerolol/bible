<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /*__TOKENS_CSS__*/
        #__COMP_ID__ {
          position: absolute;
          inset: 0;
          font-family: var(--font-family), var(--font-fallback);
        }
        #__COMP_ID__ .wrap {
          position: absolute;
          left: calc(var(--safe-left) * 1px);
          right: calc(var(--safe-right) * 1px);
          display: flex;
          justify-content: center;
        }
        #__COMP_ID__ .wrap.upper { top: calc(var(--safe-top) * 1px); align-items: flex-start; }
        #__COMP_ID__ .wrap.center { top: 0; bottom: 0; align-items: center; }
        #__COMP_ID__ .wrap.lower { bottom: calc(var(--safe-bottom) * 1px); align-items: flex-end; }
        #__COMP_ID__ .phrase {
          max-width: calc(var(--callout-max-width) * 1px);
          text-align: center;
          color: var(--color-text);
          font-size: calc(var(--callout-size) * 1px);
          font-weight: var(--callout-weight);
          line-height: 1.1;
          letter-spacing: -0.02em;
          text-shadow: var(--captions-shadow);
          opacity: 0;
        }
        #__COMP_ID__ .phrase .a { color: var(--color-emphasis); }
      </style>
      <div id="__COMP_ID__" data-composition-id="__COMP_ID__" data-width="1080" data-height="1920"></div>
      <script>
        (function () {
          /*__MOTION_JS__*/
          var T = /*__TOKENS_JSON__*/;
          var D = /*__DATA_JSON__*/;
          var root = document.getElementById("__COMP_ID__");
          root.innerHTML = '<div class="wrap ' + D.placement + '"><div class="phrase"></div></div>';
          var phrase = root.querySelector(".phrase");
          D.parts.forEach(function (p) {
            var s = document.createElement("span");
            if (p.accent) s.className = "a";
            s.textContent = p.text;
            phrase.appendChild(s);
          });
          var tl = gsap.timeline({ paused: true });
          hfEnter(tl, phrase, T.callout.entrance, 0, T);
          hfExit(tl, phrase, Math.max(0.5, D.duration - T.motion.exitSeconds), T);
          window.__timelines["__COMP_ID__"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
