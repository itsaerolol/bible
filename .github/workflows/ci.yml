name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # check-locks reads git history

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate episodes
        run: node scripts/validate-episodes.mjs

      - name: Check locked policy files
        run: node scripts/check-locks.mjs

      - name: Validate data/ against docs/schemas.md
        run: node scripts/check-analytics-data.mjs
